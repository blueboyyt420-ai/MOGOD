<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d10e69;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .user-card {
      background-color: #cbe506;
      border: 2px solid #2196f3;
      border-radius: 10px;
      padding: 20px;
      width: 250px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, background-color 0.3s;
    }

    .user-card:hover {
      transform: scale(1.05);
      background-color: #0a3f6a;
    }

    .user-card h2 {
      color: #0d47a1;
      margin-bottom: 10px;
    }

    .user-card p {
      color: #333;
      font-size: 15px;
      margin: 5px 0;
    }

    .user-card strong {
      color: #a4c015;
    }
  </style>
</head>
<body>

  <div class="user-card">
    <h2>Ramesh</h2>
    <p><strong>Age:</strong> 21</p>
    <p>A passionate Computer Science student who loves coding and exploring new technologies.</p>
  </div>

  <div class="user-card">
    <h2>Anjali Rao</h2>
    <p><strong>Age:</strong> 22</p>
    <p>An Electronics student interested in AI, IoT, and embedded systems.</p>
  </div>

  <div class="user-card">
    <h2>Rahul Mehta</h2>
    <p><strong>Age:</strong> 23</p>
    <p>Aspiring web developer focusing on full-stack projects and creative UI design.</p>
  </div>

</body>
</html>
